name: build
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run qa:wireup
      - run: npm run test:loop
      - run: npm run test:bench-judge
      - run: npm run bench:stub -- --out bench-results/ci
